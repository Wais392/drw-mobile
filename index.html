<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json"><title>Dr. W</title><style>body{background:#111;color:#eee;font:16px system-ui;max-width:480px;margin:auto;padding:24px}h1{color:#d9b66c;font-size:40px;margin-bottom:0}label{display:block;margin:16px 0 6px}button,select,input,textarea{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #555;background:#222;color:#eee;font:inherit}button{margin:8px 0;background:#d9b66c;color:#111;font-weight:bold}button:disabled{opacity:.5}canvas,video{width:100%;max-height:55vh;object-fit:contain;background:#000}textarea{height:150px}small{color:#aaa}progress{width:100%}</style><h1>Dr. W</h1><small>ON-DEVICE CINEMATIC STUDIO</small><label>Theme</label><select id="theme"><option>Random</option><option>Money</option><option>Ambition</option><option>Gym</option><option>Trading</option><option>Discipline</option></select><label>Pixabay API key (optional)</label><input id="key" type="password" autocomplete="off" placeholder="Enter your own key"><small>Without accessible footage, use original animated backgrounds.</small><label>Optional local video</label><input id="local" type="file" accept="video/*"><label>Optional licensed soundtrack (MP3 / WAV / M4A)</label><input id="musicFile" type="file" accept="audio/*"><small>No file: silent video, ready for TikTok music.</small><button id="go">Generate video</button><progress id="progress" max="13" value="0"></progress><p id="status" role="status">Ready. Keep this screen open while rendering.</p><canvas id="canvas" width="720" height="1280"></canvas><video id="preview" controls playsinline hidden></video><button id="save" disabled>Save / share video</button><textarea id="caption" readonly placeholder="Your caption appears here"></textarea><button id="copy">Copy caption</button><button id="txt">Save caption TXT</button><script src="data.js"></script><script src="app.js"></script></html>
